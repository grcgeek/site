# Skills & Tools on Home (layouts/shortcodes/toolbox.html).
#
# name:  what the tile says
# cat:   grc, identity, security, cloud, ops, lab (sets the chip and the colour edge)
# glyph: a drawing from layouts/partials/toolbox/glyph.html
# logo:  optional. A file name in assets/img/logos/ (without .svg) to show
#        your own logo on this tile instead of the drawn glyph
# did:   one line for the card: what you did with it
# where: optional. Leave it out when the resume doesn't tie the tool to a job;
#        the card then shows no employer rather than a guess
# when:  optional, shown after where
# Order sets the order in the rows and the grid.

